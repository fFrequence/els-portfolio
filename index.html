<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELS© — Edouard Le Scouarnec</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #080808; overflow: hidden; height: 100vh; }

    /* Constellation — each card on its own independent orbit around the title */
    #constellation {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }
    .orbiter {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      animation: orbit var(--speed, 120s) linear infinite;
      animation-delay: var(--start, 0s);
    }
    .orbiter.ccw {
      animation-direction: reverse;
    }
    @keyframes orbit {
      from { transform: scale(var(--xs, 1), var(--ys, 1)) rotate(0deg) translate(var(--radius, 250px)) rotate(0deg); }
      to   { transform: scale(var(--xs, 1), var(--ys, 1)) rotate(360deg) translate(var(--radius, 250px)) rotate(-360deg); }
    }
    .orbiter > .float {
      position: absolute;
      top: 0; left: 0;
      animation: gentleFloat 9s ease-in-out infinite;
      animation-delay: var(--bob, 0s);
    }
    @keyframes gentleFloat {
      0%, 100% { transform: scale(calc(1 / var(--xs, 1)), calc(1 / var(--ys, 1))) translate(-50%, -50%) translate(var(--push-x, 0px), var(--push-y, 0px)) rotate(var(--rot, 0deg)); }
      50%      { transform: scale(calc(1 / var(--xs, 1)), calc(1 / var(--ys, 1))) translate(-50%, -50%) translate(var(--push-x, 0px), var(--push-y, 0px)) translateY(-10px) rotate(calc(var(--rot, 0deg) + 1.2deg)); }
    }
    .float > .camera-card {
      pointer-events: all;
      cursor: none;
      position: relative;
    }

    /* Hero */
    #hero {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      pointer-events: none;
      text-align: center;
    }
    #hero h1 {
      font-family: 'Argent Pixel CF', serif;
      font-weight: 400;
      font-style: italic;
      font-size: clamp(100px, 14vw, 180px);
      color: #F0EDE8;
      line-height: 1;
      letter-spacing: 0;
    }
    #hero p.subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(18px, 2vw, 28px);
      color: #888;
      margin-top: 12px;
    }
    #hero p.location {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: #444;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-top: 10px;
    }
    #hero .cta {
      pointer-events: auto;
      margin-top: 36px;
      display: inline-block;
      background: none;
      border: 1px solid #444;
      color: #888;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      padding: 14px 28px;
      text-decoration: none;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    #hero .cta::after {
      content: ' →';
      margin-left: 6px;
      transition: transform 0.2s;
      display: inline-block;
    }
    #hero .cta:hover {
      color: #F0EDE8;
      border-color: #F0EDE8;
    }
    #hero .cta:hover::after {
      transform: translateX(4px);
    }

    /* Card hover meta */
    .card-meta-hover {
      position: absolute;
      bottom: -40px;
      left: 0; right: 0;
      text-align: center;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .camera-card:hover .card-meta-hover { opacity: 1; }
    .card-meta-hover .card-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      font-weight: 300;
      color: #F0EDE8;
      white-space: nowrap;
    }
    .card-meta-hover .card-cat {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      color: #555;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .camera-card { position: absolute; }

    @media (max-width: 480px) {
      #hero h1 { font-size: clamp(64px, 18vw, 100px); }
    }
  </style>
</head>
