<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELS© — Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #0A0A0A; padding-top: 80px; padding-bottom: 80px; cursor: auto; }
    html, body, * { cursor: auto !important; }
    body.locked { padding-top: 0; padding-bottom: 0; height: 100vh; overflow: hidden; }

    /* ── LOGIN ─────────────────────────────────────────────────────── */
    #login {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 18px;
      background: #080808;
      z-index: 50;
    }
    #login.hide { display: none; }
    #login .login-eyebrow {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px; letter-spacing: 0.3em; color: #555;
      text-transform: uppercase;
    }
    #login .login-title {
      font-family: 'Argent Pixel CF', serif;
      font-style: italic;
      font-size: clamp(60px, 8vw, 100px);
      color: #F0EDE8;
    }
    #login form {
      display: flex; gap: 8px; margin-top: 8px;
    }
    #login input[type=password] {
      background: #111;
      border: 1px solid #2A2A2A;
      color: #F0EDE8;
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.1em;
      padding: 12px 18px;
      width: 280px;
      outline: none;
    }
    #login input[type=password]:focus { border-color: #555; }
    #login button {
      background: #111;
      border: 1px solid #2A2A2A;
      color: #F0EDE8;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.2em;
      padding: 0 18px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    #login button:hover { border-color: #555; }
    #login .login-error {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px; letter-spacing: 0.15em;
      color: #CC2200;
      min-height: 16px;
    }

    /* ── ADMIN HEADER ─────────────────────────────────────────────── */
    #admin-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      border-bottom: 1px solid #1A1A1A;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 40;
    }
    #admin-header .brand {
      display: flex; align-items: center; gap: 16px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px; letter-spacing: 0.2em; color: #888;
      text-transform: uppercase;
    }
    #admin-header .brand img { height: 14px; filter: invert(1); }
    #admin-header .brand .live a {
      color: #555; text-decoration: none; transition: color 0.2s;
    }
    #admin-header .brand .live a:hover { color: #F0EDE8; }
    #admin-header .right {
      display: flex; gap: 18px; align-items: center;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px; letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    #admin-header .status {
      color: #555;
    }
    #admin-header .status.dirty { color: #CC8800; }
    #admin-header .status.saved { color: #00CC33; }
    #admin-header .status .dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: currentColor; margin-right: 6px; vertical-align: middle;
    }
    #admin-header button.logout {
      background: none; border: none; color: #555; cursor: pointer;
      font-family: inherit; font-size: inherit; letter-spacing: inherit;
      text-transform: inherit; padding: 0;
    }
    #admin-header button.logout:hover { color: #F0EDE8; }

    #admin-header .lang-switch {
      display: inline-flex;
      gap: 2px;
      border: 1px solid #2A2A2A;
      padding: 2px;
    }
    #admin-header .lang-btn {
      background: none;
      border: none;
      color: #555;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      padding: 4px 8px;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
    }
    #admin-header .lang-btn:hover { color: #888; }
    #admin-header .lang-btn.active { color: #080808; background: #F0EDE8; }

    /* ── TABS ─────────────────────────────────────────────────────── */
    #tabs {
      position: sticky;
      top: 56px;
      z-index: 30;
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      border-bottom: 1px solid #1A1A1A;
      padding: 14px 24px;
      display: flex;
      gap: 4px;
    }
    #tabs button {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #555;
      background: none;
      border: 1px solid transparent;
      padding: 8px 16px;
      cursor: pointer;
      transition: all 0.15s;
    }
    #tabs button:hover { color: #888; border-color: #2A2A2A; }
    #tabs button.active { color: #F0EDE8; border-color: #444; }

    /* ── CONTENT ──────────────────────────────────────────────────── */
    .tab-pane {
      padding: 32px 24px 32px;
      max-width: 880px;
    }
    .tab-pane[hidden] { display: none; }

    .section-eyebrow {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px; letter-spacing: 0.2em; color: #888;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    /* ── FIELD WIDGET ─────────────────────────────────────────────── */
    .field {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 12px;
      margin-bottom: 10px;
      align-items: start;
    }
    .field > label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px; letter-spacing: 0.18em; color: #666;
      text-transform: uppercase;
      padding-top: 8px;
    }
    .field input, .field textarea, .field select {
      width: 100%;
      background: #111;
      border: 1px solid #1E1E1E;
      color: #F0EDE8;
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.04em;
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: #444; }
    .field textarea { min-height: 80px; line-height: 1.6; resize: vertical; }
    .field .field-hint {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px; letter-spacing: 0.1em; color: #444;
      padding-top: 4px;
    }
    .field .with-button {
      display: flex; gap: 8px;
    }
    .field .with-button input { flex: 1; }
    .field button.aux {
      background: #111;
      border: 1px solid #2A2A2A;
      color: #888;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      padding: 0 14px;
      cursor: pointer;
      text-transform: uppercase;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .field button.aux:hover { color: #F0EDE8; border-color: #555; }
    .field button.aux:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── CARD-IN-EDITOR ────────────────────────────────────────────── */
    .edit-card {
      border: 1px solid #1E1E1E;
      background: #0D0D0D;
      margin-bottom: 10px;
    }
    .edit-card-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }
    .edit-card-head:hover { background: #131313; }
    .edit-card-head .grip {
      color: #333;
      font-size: 14px;
      cursor: grab;
      touch-action: none;
      user-select: none;
      padding: 4px 2px;
    }
    .edit-card-head .grip:active { cursor: grabbing; }
    .edit-card.dragging {
      opacity: 0.45;
      background: #1a1a1a;
      border-color: #444;
    }
    .edit-card-head .head-thumb {
      width: 48px; height: 30px;
      background: #1A1A1A; background-size: cover; background-position: center;
      border: 1px solid #222;
      flex-shrink: 0;
    }
    .edit-card-head .head-title {
      flex: 1;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 16px;
      color: #F0EDE8;
    }
    .edit-card-head .head-meta {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px; letter-spacing: 0.15em; color: #555;
      text-transform: uppercase;
    }
    .edit-card-head .head-chev {
      color: #444;
      transition: transform 0.2s;
    }
    .edit-card.open .edit-card-head .head-chev { transform: rotate(90deg); }
    .edit-card-body {
      display: none;
      padding: 14px 14px 18px;
      border-top: 1px solid #1A1A1A;
    }
    .edit-card.open .edit-card-body { display: block; }
    .edit-card-actions {
      display: flex; justify-content: flex-end; margin-top: 14px;
    }
    button.delete {
      background: none;
      border: 1px solid #441111;
      color: #884444;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      padding: 6px 14px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.15s;
    }
    button.delete:hover { background: #1a0808; color: #CC4444; border-color: #884444; }

    /* ── ADD BUTTON ───────────────────────────────────────────────── */
    button.add {
      background: none;
      border: 1px dashed #2A2A2A;
      color: #666;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      padding: 12px 18px;
      cursor: pointer;
      text-transform: uppercase;
      width: 100%;
      margin-bottom: 24px;
      transition: all 0.15s;
    }
    button.add:hover { color: #F0EDE8; border-color: #555; }

    /* ── SIMPLE LIST EDITOR (eras, disciplines, clients) ──────────── */
    .list-row {
      display: flex; gap: 8px; margin-bottom: 6px;
    }
    .list-row input { flex: 1;
      background: #111; border: 1px solid #1E1E1E; color: #F0EDE8;
      font-family: 'Share Tech Mono', monospace; font-size: 12px;
      padding: 7px 10px; outline: none;
    }
    .list-row input:focus { border-color: #444; }
    .list-row button.x {
      background: #111;
      border: 1px solid #1E1E1E;
      color: #666;
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      padding: 0 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .list-row button.x:hover { color: #CC4444; border-color: #441111; }

    /* ── SAVE BAR ─────────────────────────────────────────────────── */
    #save-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 60px;
      background: rgba(10, 10, 10, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid #1A1A1A;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 40;
    }
    #save-bar button.save {
      background: #F0EDE8;
      color: #080808;
      border: none;
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.2em;
      padding: 12px 28px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.15s;
    }
    #save-bar button.save:hover { background: #fff; }
    #save-bar button.save:disabled { background: #333; color: #666; cursor: not-allowed; }
    #save-bar .save-status {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px; letter-spacing: 0.18em;
      color: #555;
      text-transform: uppercase;
    }

    /* ── TOAST ─────────────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 80px; left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: #1A1A1A;
      border: 1px solid #333;
      color: #F0EDE8;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      padding: 10px 22px;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      text-transform: uppercase;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.error { color: #CC4444; border-color: #441111; }
    #toast.success { color: #00CC33; border-color: #115511; }
  </style>
</head>
<body class="locked loaded">

  <!-- ── LOGIN SCREEN ───────────────────────────────────── -->
  <div id="login">
    <div class="login-eyebrow" data-i18n="login_eyebrow">ELS© Admin</div>
    <div class="login-title" data-i18n="login_title">Restricted.</div>
    <form id="login-form">
      <input type="password" id="login-password" data-i18n-placeholder="login_password" placeholder="Password" autocomplete="current-password" autofocus>
      <button type="submit" data-i18n="login_enter">ENTER →</button>
    </form>
    <div class="login-error" id="login-error"></div>
    <div class="lang-switch" style="margin-top:24px">
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="fr">FR</button>
    </div>
  </div>

  <!-- ── ADMIN UI ───────────────────────────────────────── -->
  <header id="admin-header" hidden>
    <div class="brand">
      <img src="assets/logoELS.svg" alt="ELS©">
      <span data-i18n="admin_label">ADMIN</span>
      <span class="live">· <a href="/" target="_blank" data-i18n="view_live">VIEW LIVE ↗</a></span>
    </div>
    <div class="right">
      <span class="lang-switch">
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="fr">FR</button>
      </span>
      <span class="status" id="status"><span class="dot"></span>SAVED</span>
      <button class="logout" id="logout" data-i18n="logout">LOGOUT</button>
    </div>
  </header>

  <nav id="tabs" hidden>
    <button class="active" data-tab="films" data-i18n="tab_films">Films</button>
    <button data-tab="about" data-i18n="tab_about">About</button>
    <button data-tab="agencies" data-i18n="tab_agencies">Agencies</button>
    <button data-tab="meta" data-i18n="tab_meta">Socials &amp; Meta</button>
  </nav>

  <div id="content" hidden>
    <section class="tab-pane" data-pane="films">
      <div class="section-eyebrow" data-i18n="eras_eyebrow">Eras (grouping for the Work page)</div>
      <div id="eras-list"></div>
      <button class="add" data-add="era" data-i18n="add_era">+ Add Era</button>

      <div class="section-eyebrow" style="margin-top:32px" data-i18n="films_eyebrow">Films</div>
      <div id="films-list"></div>
      <button class="add" data-add="film" data-i18n="add_film">+ Add Film</button>
    </section>

    <section class="tab-pane" data-pane="about" hidden>
      <div class="section-eyebrow" data-i18n="hero_eyebrow">Hero (home page)</div>
      <div class="field"><label data-i18n="f_title">Title</label><input id="hero-title"></div>
      <div class="field"><label data-i18n="f_subtitle">Subtitle</label><input id="hero-subtitle"></div>
      <div class="field"><label data-i18n="f_location">Location</label><input id="hero-location"></div>

      <div class="section-eyebrow" style="margin-top:32px" data-i18n="bio_eyebrow">Bio (one paragraph per entry · wrap key phrases in &lt;strong&gt;…&lt;/strong&gt;)</div>
      <div id="bio-list"></div>
      <button class="add" data-add="bio" data-i18n="add_paragraph">+ Add Paragraph</button>

      <div class="section-eyebrow" style="margin-top:32px" data-i18n="disciplines_eyebrow">Disciplines</div>
      <div id="disciplines-list"></div>
      <button class="add" data-add="discipline" data-i18n="add_discipline">+ Add Discipline</button>

      <div class="section-eyebrow" style="margin-top:32px" data-i18n="clients_eyebrow">Selected Clients</div>
      <div id="clients-list"></div>
      <button class="add" data-add="client" data-i18n="add_client">+ Add Client</button>
    </section>

    <section class="tab-pane" data-pane="agencies" hidden>
      <div class="section-eyebrow" data-i18n="agencies_eyebrow">Representation (shown on About + Contact)</div>
      <div id="agencies-list"></div>
      <button class="add" data-add="agency" data-i18n="add_agency">+ Add Agency</button>
    </section>

    <section class="tab-pane" data-pane="meta" hidden>
      <div class="section-eyebrow" data-i18n="contact_eyebrow">Contact</div>
      <div class="field"><label data-i18n="f_email">Email</label><input id="meta-email" type="email"></div>

      <div class="section-eyebrow" style="margin-top:32px" data-i18n="socials_eyebrow">Socials</div>
      <div class="field"><label data-i18n="f_instagram">Instagram</label><input id="meta-instagram"></div>
      <div class="field"><label data-i18n="f_vimeo_link">Vimeo</label><input id="meta-vimeo"></div>
      <div class="field"><label data-i18n="f_linkedin">LinkedIn</label><input id="meta-linkedin"></div>

      <div class="section-eyebrow" style="margin-top:32px" data-i18n="footer_eyebrow">Footer</div>
      <div class="field"><label data-i18n="f_copyright">Copyright</label><input id="meta-copyright"></div>
    </section>
  </div>

  <div id="save-bar" hidden>
    <span class="save-status" id="save-status">No unsaved changes</span>
    <button class="save" id="save-btn" data-i18n="btn_save" disabled>Save All Changes</button>
  </div>

  <div id="toast"></div>

    let LANG = SUPPORTED_LANGS.includes(localStorage.getItem(LANG_KEY)) ? localStorage.getItem(LANG_KEY) : 'en';

    function t(key, params) {
      const dict = TRANSLATIONS[LANG] || TRANSLATIONS.en;
      let s = (key in dict) ? dict[key] : (TRANSLATIONS.en[key] || key);
      if (params) Object.keys(params).forEach(k => { s = s.replace(new RegExp('{{'+k+'}}','g'), params[k]); });
      return s;
    }

    function setLang(lang) {
      if (!SUPPORTED_LANGS.includes(lang)) return;
      LANG = lang;
      localStorage.setItem(LANG_KEY, lang);
      applyStaticTranslations();
      // Update language toggle buttons + re-render dynamic content
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
      if (data) renderAll();
      // Refresh status text since it's not a data-i18n element (it has the dot too)
      if (typeof dirty !== 'undefined') (dirty ? markDirty : markClean)();
    }

    // Walks the DOM and updates text/placeholder/value of every element with a data-i18n* attribute

      document.querySelectorAll('[data-i18n]').forEach(el => {

      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        el.placeholder = t(el.dataset.i18nPlaceholder);

      document.querySelectorAll('[data-i18n-value]').forEach(el => {

      el.textContent = msg;

      clearTimeout(toast._t);

    // ─── Auth & Boot ────────────────────────────────────────────────────
    async function attemptLoad() {
      // Fetch data from the API (GET is public, no auth needed)
      const res = await fetch('/api/data', { cache: 'no-store' });
      if (!res.ok) throw new Error('Failed to load data');
      return res.json();
    }

    async function boot() {
      try {
        data = await attemptLoad();
      } catch (e) {
        toast(t('toast_load_failed'), 'error');
        return;
      }

      // Show admin if we have a token; otherwise show login
      if (token()) showAdmin();
      else showLogin();

    function showLogin() {
      $('login').classList.remove('hide');
      document.body.classList.add('locked');
      ['admin-header', 'tabs', 'content', 'save-bar'].forEach(id => $(id).hidden = true);
    }

    function showAdmin() {
      $('login').classList.add('hide');
      document.body.classList.remove('locked');
      ['admin-header', 'tabs', 'content', 'save-bar'].forEach(id => $(id).hidden = false);
      renderAll();
      initDragSort($('films-list'), 'films', renderFilms);
      initDragSort($('eras-list'),  'eras',  renderEras);
      markClean();

    // ─── Drag-to-reorder ────────────────────────────────────────────────
    // Vanilla pointer-event handler. Works with mouse + touch.
    // - pointerdown on a `.grip` inside the container starts a drag
    // - pointermove (on document) re-inserts the dragged card relative to siblings
    // - pointerup commits the new order back to data[arrayName]
    function initDragSort(container, arrayName, rerender) {
      let dragging = null;

      container.addEventListener('pointerdown', (e) => {
        const grip = e.target.closest('.grip');
        if (!grip) return;
        const card = grip.closest('.edit-card');
        if (!card || !container.contains(card)) return;
        e.preventDefault();
        dragging = card;
        card.classList.add('dragging');
        document.body.style.userSelect = 'none';
      });

      document.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        e.preventDefault();
        // Find the card the pointer is currently over (skipping the dragged one)
        const cards = [...container.querySelectorAll('.edit-card')].filter(c => c !== dragging);
        let target = null;
        for (const c of cards) {
          const rect = c.getBoundingClientRect();
          if (e.clientY >= rect.top && e.clientY <= rect.bottom) { target = c; break; }
        }
        if (!target) return;
        const rect = target.getBoundingClientRect();
        const before = e.clientY < rect.top + rect.height / 2;
        container.insertBefore(dragging, before ? target : target.nextSibling);
      });

      document.addEventListener('pointerup', () => {
        if (!dragging) return;
        document.body.style.userSelect = '';
        const cards = [...container.querySelectorAll('.edit-card')];
        const oldArr = data[arrayName];
        // data-card-idx still holds the *original* index from the last render
        const newArr = cards.map(c => oldArr[+c.dataset.cardIdx]);
        dragging.classList.remove('dragging');
        dragging = null;
        data[arrayName] = newArr;
        rerender();    // re-render with the new order (resets data-card-idx)
        markDirty();
      });

      document.addEventListener('pointercancel', () => {
        if (!dragging) return;
        dragging.classList.remove('dragging');
        dragging = null;
        document.body.style.userSelect = '';
      });
    }

    $('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const pw = $('login-password').value;
      if (!pw) return;
      // Validate by attempting a no-op save (POST same data we already have)
      $('login-error').textContent = '';
      const res = await fetch('/api/data', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + pw,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
      });
      if (res.ok) {
        setToken(pw);
        showAdmin();
      } else if (res.status === 401) {
        $('login-error').textContent = t('login_wrong');
      } else {
        $('login-error').textContent = t('login_server_error') + ' (' + res.status + ')';
      }
    });

    $('logout').addEventListener('click', () => {
      if (dirty && !confirm(t('confirm_logout_dirty'))) return;
      clearToken();
      $('login-password').value = '';
      showLogin();
    });

        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.querySelectorAll('.tab-pane').forEach(p => {
          p.hidden = p.dataset.pane !== tab;
        });
      });
    });

    // — eras —
    function renderEras() {
      const root = $('eras-list');
      root.innerHTML = data.eras.map((era, i) => `
        <div class="edit-card open" data-card-idx="${i}">
          <div class="edit-card-head" style="cursor:default">
            <span class="grip">⠿</span>
            <div class="head-title">${escapeHtml(era.label) || '<em style="color:#444">' + t('unnamed') + '</em>'}</div>
            <div class="head-meta">// ${era.year}</div>
          </div>
          <div class="edit-card-body">
            <div class="field"><label>${t('f_id')}</label><input data-era-field="id" data-i="${i}" value="${escapeAttr(era.id)}"></div>
            <div class="field"><label>${t('f_label')}</label><input data-era-field="label" data-i="${i}" value="${escapeAttr(era.label)}"></div>
            <div class="field"><label>${t('f_year')}</label><input data-era-field="year" data-i="${i}" type="number" value="${era.year}"></div>
            <div class="edit-card-actions"><button class="delete" data-delete-era="${i}">${t('btn_delete_era')}</button></div>
          </div>
        </div>
      `).join('');
      // Wire inputs
      root.querySelectorAll('[data-era-field]').forEach(input => {
        input.addEventListener('input', () => {
          const i = +input.dataset.i, f = input.dataset.eraField;
          data.eras[i][f] = f === 'year' ? +input.value : input.value;
          markDirty();
        });
      });
      root.querySelectorAll('[data-delete-era]').forEach(btn => {
        btn.addEventListener('click', () => {
          const i = +btn.dataset.deleteEra;
          if (!confirm(t('confirm_delete_era', { name: data.eras[i].label }))) return;
          data.eras.splice(i, 1);
          renderEras(); renderFilms(); markDirty();
        });
      });
    }

    // — films —
    function renderFilms() {
      const root = $('films-list');
      root.innerHTML = data.films.map((film, i) => {
        const eraOptions = data.eras.map(e =>
          `<option value="${escapeAttr(e.id)}"${e.id === film.era ? ' selected' : ''}>${escapeHtml(e.label)}</option>`
        ).join('');
        const catOptions = data.categories.filter(c => c.id !== 'all').map(c =>
          `<option value="${escapeAttr(c.id)}"${c.id === film.category ? ' selected' : ''}>${escapeHtml(c.label)}</option>`
        ).join('');
        return `
          <div class="edit-card" data-film-card="${i}" data-card-idx="${i}">
            <div class="edit-card-head" data-toggle="${i}">
              <span class="grip">⠿</span>
              <div class="head-thumb" style="background-image:url('${escapeAttr(film.thumb)}')"></div>
              <div class="head-title">${escapeHtml(film.title) || '<em style="color:#444">' + t('untitled') + '</em>'}</div>
              <div class="head-meta">${escapeHtml(film.year)} · ${escapeHtml(film.category)}</div>
              <span class="head-chev">▸</span>
            </div>
            <div class="edit-card-body">
              <div class="field"><label>${t('f_title')}</label><input data-film-field="title" data-i="${i}" value="${escapeAttr(film.title)}"></div>
              <div class="field"><label>${t('f_vimeo')}</label>
                <div class="with-button">
                  <input data-film-field="vimeo" data-i="${i}" value="${escapeAttr(film.vimeo)}" placeholder="${escapeAttr(t('f_vimeo_placeholder'))}">
                  <button class="aux" data-fetch-vimeo="${i}">${t('btn_fetch_vimeo')}</button>
                </div>
                <div class="field-hint">${t('f_vimeo_hint')}</div>
              </div>
              <div class="field"><label>${t('f_thumb')}</label><input data-film-field="thumb" data-i="${i}" value="${escapeAttr(film.thumb)}"></div>
              <div class="field"><label>${t('f_year')}</label><input data-film-field="year" data-i="${i}" type="number" value="${film.year}"></div>
              <div class="field"><label>${t('f_era')}</label><select data-film-field="era" data-i="${i}">${eraOptions}</select></div>
              <div class="field"><label>${t('f_category')}</label><select data-film-field="category" data-i="${i}">${catOptions}</select></div>
              <div class="field"><label>${t('f_agency')}</label><input data-film-field="agency" data-i="${i}" value="${escapeAttr(film.agency || '')}" placeholder="${escapeAttr(t('f_optional'))}"></div>
              <div class="field"><label>${t('f_fps')}</label><input data-film-field="fps" data-i="${i}" value="${escapeAttr(film.fps)}"></div>
              <div class="field"><label>${t('f_ei')}</label><input data-film-field="ei" data-i="${i}" value="${escapeAttr(film.ei)}"></div>
              <div class="field"><label>${t('f_clip')}</label><input data-film-field="clip" data-i="${i}" value="${escapeAttr(film.clip)}"></div>
              <div class="field"><label>${t('f_duration')}</label><input data-film-field="duration" data-i="${i}" value="${escapeAttr(film.duration)}"></div>
              <div class="edit-card-actions"><button class="delete" data-delete-film="${i}">${t('btn_delete_film')}</button></div>
            </div>
          </div>
        `;
      }).join('');

      // Wire toggles
      root.querySelectorAll('[data-toggle]').forEach(head => {
        head.addEventListener('click', e => {
          if (e.target.closest('.grip')) return;
          head.parentElement.classList.toggle('open');
        });
      });
      // Wire inputs
      root.querySelectorAll('[data-film-field]').forEach(input => {
        input.addEventListener('input', () => {
          const i = +input.dataset.i, f = input.dataset.filmField;
          let v = input.value;
          if (f === 'year') v = +v;
          if (f === 'agency' && v === '') v = null;
          data.films[i][f] = v;
          // Update head title/thumb live
          const head = input.closest('.edit-card').querySelector('.edit-card-head');
          if (f === 'title') head.querySelector('.head-title').textContent = v || t('untitled');
          if (f === 'thumb') head.querySelector('.head-thumb').style.backgroundImage = `url('${v}')`;
          if (f === 'year' || f === 'category') head.querySelector('.head-meta').textContent = `${data.films[i].year} · ${data.films[i].category}`;
          markDirty();
        });
      });
      // Wire delete
      root.querySelectorAll('[data-delete-film]').forEach(btn => {
        btn.addEventListener('click', () => {
          const i = +btn.dataset.deleteFilm;
          if (!confirm(t('confirm_delete_film', { name: data.films[i].title }))) return;
          data.films.splice(i, 1);
          renderFilms(); markDirty();
        });
      });
      // Wire Vimeo fetch
      root.querySelectorAll('[data-fetch-vimeo]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const i = +btn.dataset.fetchVimeo;
          const input = root.querySelector(`[data-film-field=vimeo][data-i="${i}"]`);
          const raw = input.value.trim();
          if (!raw) { toast(t('toast_vimeo_need_id'), 'error'); return; }
          const id = (raw.match(/(\d{6,})/) || [])[1];
          if (!id) { toast(t('toast_vimeo_no_id'), 'error'); return; }
          btn.disabled = true; btn.textContent = t('btn_fetching');
          try {
            const res = await fetch(`https://vimeo.com/api/oembed.json?url=https://vimeo.com/${id}&width=1920`);
            if (!res.ok) throw new Error();
            const meta = await res.json();
            data.films[i].vimeo = id;
            data.films[i].title = meta.title || data.films[i].title;
            data.films[i].thumb = meta.thumbnail_url || data.films[i].thumb;
            renderFilms();
            toast(t('toast_vimeo_fetched'), 'success');
            markDirty();
          } catch {
            toast(t('toast_vimeo_failed'), 'error');
          } finally {
            btn.disabled = false; btn.textContent = t('btn_fetch_vimeo');
          }
        });
      });
    }

      $('meta-instagram').oninput = e => { data.socials.instagram = e.target.value; markDirty(); };
      $('meta-vimeo').oninput = e => { data.socials.vimeo = e.target.value; markDirty(); };
      $('meta-linkedin').oninput = e => { data.socials.linkedin = e.target.value; markDirty(); };
      $('meta-copyright').oninput = e => { data.copyright = e.target.value; markDirty(); };
    }

    // ─── Add buttons ────────────────────────────────────────────────────
    document.querySelectorAll('[data-add]').forEach(btn => {
      btn.addEventListener('click', () => {
        const kind = btn.dataset.add;
        if (kind === 'era')        data.eras.push({ id: 'era-' + (data.eras.length + 1), label: 'New Era', year: new Date().getFullYear() });
        if (kind === 'film')       data.films.push({ id: 'film-' + Date.now(), title: '', year: new Date().getFullYear(), era: data.eras[0]?.id || '', category: 'commercial', agency: null, vimeo: '', thumb: '', fps: '23.976', ei: '800', clip: 'A000C000', duration: '0:00' });
        if (kind === 'bio')        data.bio.push('');
        if (kind === 'discipline') data.disciplines.push('');
        if (kind === 'client')     data.clients.push('');
        if (kind === 'agency')     data.agencies.push({ region: '', name: '', contact: null, address: [], emails: [] });
        renderAll();
        markDirty();
      });
    });

    // ─── Save ───────────────────────────────────────────────────────────
    $('save-btn').addEventListener('click', async () => {
      const btn = $('save-btn');
      btn.disabled = true;
      $('save-status').textContent = t('btn_saving');
      try {
        const res = await fetch('/api/data', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token(), 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (res.status === 401) {
          clearToken();
          toast(t('toast_session_expired'), 'error');
          showLogin();
          return;
        }
        if (!res.ok) throw new Error('HTTP ' + res.status);
        markClean();
        toast(t('toast_saved'), 'success');
      } catch (e) {
        toast(t('toast_save_failed') + ': ' + e.message, 'error');
        btn.disabled = false;
        $('save-status').textContent = t('status_dirty');
      }
    });

    // Warn on close
    window.addEventListener('beforeunload', e => {
      if (dirty) { e.preventDefault(); e.returnValue = ''; }
    });

    // ─── Helpers ────────────────────────────────────────────────────────
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
    function escapeAttr(s) { return escapeHtml(s); }

    // ─── Wire language toggle buttons (both the login + header switches) ───
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => setLang(btn.dataset.lang));
    });

    // ─── Go ─────────────────────────────────────────────────────────────
    // Apply translations once before anything else, so the login screen renders
    // in the saved language. setLang also flips the active state on .lang-btn.
    setLang(LANG);
    boot();
  </script>
</body>
</html>
