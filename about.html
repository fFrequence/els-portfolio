<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELS© — About</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #0A0A0A; padding-top: 80px; padding-bottom: 60px; }

    .about-wrap {
      padding: 60px 60px 80px;
      max-width: 660px;
    }

    .page-eyebrow {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    .bio {
      font-size: 13px;
      line-height: 210%;
      color: #AAA;
      margin-bottom: 24px;
    }
    .bio:last-child { margin-bottom: 0; }
    .bio strong {
      color: #F0EDE8;
      font-weight: 400;
    }

    hr.divider {
      border: none;
      border-top: 1px solid #1E1E1E;
      margin: 40px 0;
      max-width: 600px;
    }

    .section-label {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .disciplines-list {
      list-style: none;
      margin-bottom: 0;
    }
    .disciplines-list li {
      font-size: 12px;
      color: #666;
      letter-spacing: 0.1em;
      line-height: 2;
      padding-left: 16px;
      position: relative;
    }
    .disciplines-list li::before {
      content: '—';
      position: absolute;
      left: 0;
      color: #333;
    }

    .clients-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .client-tag {
      font-size: 11px;
      color: #666;
      letter-spacing: 0.12em;
      border: 1px solid #333;
      padding: 5px 12px;
      text-transform: uppercase;
    }

    .agencies-list {
      list-style: none;
    }
    .agencies-list li {
      font-size: 12px;
      line-height: 2;
      letter-spacing: 0.08em;
    }
    .agencies-list .agency-name {
      color: #F0EDE8;
    }
    .agencies-list .agency-city {
      color: #555;
      margin-left: 6px;
    }
  </style>
</head>
<body data-page="about">
  <div id="cursor-glow"></div>
  <div id="cursor"></div>

  <nav>
    <a class="logo" href="index.html"><img src="assets/logoELS.svg" alt="ELS©"></a>
    <button class="nav-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="work.html">Work</a></li>
      <li><a href="about.html" class="active">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <div class="about-wrap">
    <div class="page-eyebrow">About</div>

    <div id="about-bio"></div>

    <hr class="divider">

    <div class="section-label">Disciplines</div>
    <ul class="disciplines-list" id="about-disciplines"></ul>

    <hr class="divider">

    <div class="section-label">Selected Clients</div>
    <div class="clients-row" id="about-clients"></div>

    <hr class="divider">

    <div class="section-label">Represented By</div>
    <ul class="agencies-list" id="about-agencies"></ul>
  </div>

  <footer class="footer-strip">
    <div class="footer-socials">
      <a id="footer-instagram" href="#" target="_blank" rel="noopener">Instagram</a>
      <a id="footer-vimeo"     href="#" target="_blank" rel="noopener">Vimeo</a>
      <a id="footer-linkedin"  href="#" target="_blank" rel="noopener">LinkedIn</a>
    </div>
    <div class="footer-ticker">
      <div class="footer-ticker-inner" id="ticker-inner"></div>
    </div>
    <div class="footer-copy" id="footer-copy"></div>
  </footer>

  <script src="data.js"></script>
  <script src="cursor.js"></script>
  <script src="render.js"></script>
</body>
</html>
