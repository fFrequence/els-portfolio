<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELS© — Work</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #0A0A0A; padding-top: 80px; padding-bottom: 60px; }

    .page-header {
      padding: 48px 48px 32px;
    }
    .page-eyebrow {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .page-title {
      font-family: 'Argent Pixel CF', serif;
      font-weight: 400;
      font-size: clamp(80px, 10vw, 130px);
      color: #F0EDE8;
      line-height: 0.9;
    }
    .page-title em { font-style: italic; }
    .year-heading h2 {
      font-family: 'Argent Pixel CF', serif !important;
      font-weight: 400 !important;
      font-style: italic !important;
    }
    .film-count {
      font-size: 11px;
      color: #555;
      letter-spacing: 0.15em;
      margin-top: 16px;
    }

    /* Filter bar */
    .filter-bar {
      position: sticky;
      top: 62px;
      z-index: 90;
      background: rgba(10, 10, 10, 0.72);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      border-bottom: 1px solid #1A1A1A;
      padding: 14px 48px;
      display: flex;
      gap: 4px;
    }
    .filter-btn {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #555;
      background: none;
      border: 1px solid transparent;
      padding: 8px 16px;
      cursor: none;
      transition: all 0.2s;
    }
    .filter-btn:hover { color: #888; border-color: #333; }
    .filter-btn.active { color: #F0EDE8; border-color: #444; }

    /* Gallery */
    .gallery { padding: 0 48px 48px; }

    .year-section { margin-top: 56px; }
    .year-heading {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 28px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1A1A1A;
    }
    .year-heading h2 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(28px, 3.5vw, 44px);
      color: #F0EDE8;
    }
    .year-tag {
      font-size: 11px;
      color: #444;
      letter-spacing: 0.15em;
    }
    .year-scroll {
      font-size: 10px;
      color: #333;
      letter-spacing: 0.1em;
      margin-left: auto;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    /* Work card */
    .work-card {
      position: relative;
      cursor: none;
    }
    .work-card .camera-card {
      position: relative;
      width: 100%;
      opacity: 1;
      filter: brightness(1);
      transition: border-color 0.2s, transform 0.2s, filter 0.2s;
    }
    .work-card:hover .camera-card {
      border-color: #333;
      transform: scale(1.04);
      filter: brightness(1.05);
    }
    .camera-card .card-thumb { height: 0; padding-bottom: 62.5%; position: relative; }
    .camera-card .card-thumb .placeholder,
    .camera-card .card-thumb img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
    }
    .work-card-info {
      margin-top: 10px;
    }
    .work-card-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: 16px;
      color: #F0EDE8;
    }
    .work-card-meta {
      font-size: 10px;
      color: #555;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 3px;
    }
    .card-hud-bottom .agency {
      font-size: 8px;
      color: #555;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Empty card */
    .work-card.empty .camera-card {
      opacity: 0.3;
      filter: brightness(0.4);
    }
    .work-card.empty:hover .camera-card {
      transform: none;
      border-color: var(--border-2);
    }
    .work-card.empty .work-card-title { color: #444; }
  </style>
</head>
<body data-page="work">
  <div id="cursor-glow"></div>
  <div id="cursor"></div>

  <nav>
    <a class="logo" href="index.html"><img src="assets/logoELS.svg" alt="ELS©"></a>
    <button class="nav-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="work.html" class="active">Work</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <div class="page-header">
    <div class="page-eyebrow">Portfolio</div>
    <h1 class="page-title">All <em>Works</em></h1>
    <div class="film-count" id="film-count"></div>
  </div>

  <div class="gallery" id="gallery"></div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal-inner">
      <div class="modal-hud-top">
        <span id="modal-fps">FPS 23.976 EI 800</span>
        <span><span class="rec-dot"></span>REC</span>
        <button class="modal-close" id="modal-close-btn">[ ESC ] CLOSE</button>
      </div>
      <div class="modal-video">
        <iframe id="modal-iframe" src="" allowfullscreen></iframe>
      </div>
      <div class="modal-info">
        <div>
          <div class="modal-title" id="modal-title"></div>
          <div class="modal-meta" id="modal-meta"></div>
        </div>
        <button class="modal-share" id="modal-share">SHARE ↗</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">LINK COPIED ✓</div>

  <footer class="footer-strip">
    <div class="footer-socials">
      <a id="footer-instagram" href="#" target="_blank" rel="noopener">Instagram</a>
      <a id="footer-vimeo"     href="#" target="_blank" rel="noopener">Vimeo</a>
      <a id="footer-linkedin"  href="#" target="_blank" rel="noopener">LinkedIn</a>
    </div>
    <div class="footer-ticker">
      <div class="footer-ticker-inner" id="ticker-inner"></div>
    </div>
    <div class="footer-copy" id="footer-copy"></div>
  </footer>

  <script src="data.js"></script>
  <script src="cursor.js"></script>
  <script src="render.js"></script>
</body>
</html>
